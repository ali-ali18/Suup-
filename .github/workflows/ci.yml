name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as docker-compose.yml
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_USER: suup
          POSTGRES_PASSWORD: suup
          POSTGRES_DB: suup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suup -d suup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL: postgres://suup:suup@127.0.0.1:5432/suup
