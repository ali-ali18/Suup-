name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as docker-compose.yml
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_USER: suup
          POSTGRES_PASSWORD: suup
          POSTGRES_DB: suup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suup -d suup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Build the bot machine image
        run: docker build --tag suup-sandbox:ci docker/sandbox
      - name: Build the server image (not pushed)
        run: docker build --file docker/server/Dockerfile --tag suup:ci .
      - name: Smoke test the server image
        run: |
          docker run --rm suup:ci --help | head -n 3
          docker run --rm suup:ci server --generate-token | grep -Eq '^[A-Za-z0-9_-]{43}$'
      - name: Check the production compose file
        run: >
          POSTGRES_PASSWORD=ci SUUP_SERVER_TOKEN=0123456789012345678901234567890123456789 DOCKER_GID=999
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Test the server end to end (real Postgres, real client)
        run: pnpm vitest run packages/api packages/server apps/cli/test/server.test.ts
        env:
          DATABASE_URL: postgres://suup:suup@127.0.0.1:5432/suup
      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://suup:suup@127.0.0.1:5432/suup
          # Also run the executor contract against a real container (see packages/sandbox/test).
          SUUP_DOCKER_TESTS: "1"
          SUUP_SANDBOX_IMAGE: suup-sandbox:ci
