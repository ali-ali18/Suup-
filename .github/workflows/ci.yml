name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as docker-compose.yml
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_USER: suup
          POSTGRES_PASSWORD: suup
          POSTGRES_DB: suup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suup -d suup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Build the bot machine image
        run: docker build --tag suup-sandbox:ci docker/sandbox
      - name: Build the connector runner image (stdio MCP servers in containers)
        run: docker build --tag suup-connector-runner:ci docker/connector-runner
      - name: Build the egress proxy image (the proxy in its own container; the program is bundled first)
        run: |
          node apps/sidecar/scripts/egress-image.mjs docker/egress
          docker build --tag suup-egress:ci docker/egress
      - name: Build the server image (not pushed)
        run: docker build --file docker/server/Dockerfile --tag suup:ci .
      - name: Smoke test the server image
        run: |
          docker run --rm suup:ci --help | head -n 3
          docker run --rm suup:ci server --generate-token | grep -Eq '^[A-Za-z0-9_-]{43}$'
      - name: Check the production compose file
        run: >
          POSTGRES_PASSWORD=ci SUUP_SERVER_TOKEN=0123456789012345678901234567890123456789 DOCKER_GID=999
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Test the server end to end (real Postgres, real client)
        run: pnpm vitest run packages/api packages/server apps/cli/test/server.test.ts
        env:
          DATABASE_URL: postgres://suup:suup@127.0.0.1:5432/suup
      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://suup:suup@127.0.0.1:5432/suup
          # Also run the executor contract against a real container (see packages/sandbox/test).
          SUUP_DOCKER_TESTS: "1"
          SUUP_SANDBOX_IMAGE: suup-sandbox:ci
          # The network tests (internal network, egress proxy) and the containerised connector tests.
          SUUP_CONNECTOR_IMAGE: suup-connector-runner:ci
          # The proxy in its own container, with the worker as a host process (the Windows topology).
          SUUP_EGRESS_IMAGE: suup-egress:ci
      # The desktop app: the web build (the unit tests of the app ran with `pnpm test` above), then the
      # browser tests against a real server in this process (Postgres-backed, scripted provider).
      - name: Build the desktop web app
        run: pnpm --filter @suup/desktop build
      - name: Install Chromium for the browser tests
        run: pnpm --filter @suup/desktop exec playwright install --with-deps chromium
      - name: Test the desktop app in a browser (real server)
        run: pnpm --filter @suup/desktop test:e2e
        env:
          DATABASE_URL: postgres://suup:suup@127.0.0.1:5432/suup

  # A separate job: it only checks that the native shell still compiles, so a broken Tauri shell is
  # caught without slowing the main job. No bundling, no artifacts.
  tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the system libraries of the webview
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev build-essential
          pkg-config libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # `tauri::generate_context!` embeds the built web app, so it must exist.
      - run: pnpm --filter @suup/desktop build
      # The shell declares the Node runtime as an external binary and the server as resources, and
      # the build script of Tauri checks they exist: prepare them first (apps/sidecar/scripts).
      - run: pnpm --filter @suup/sidecar run bundle
      - name: cargo check (no bundle)
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
